[project]
name = "runeterra-cognitive-backend"
version = "0.1.0"
description = "Runeterra World cognitive runtime integrating Generative Agents, Letta, LangGraph, DeepEval and MASEval"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-sqlite>=2.0,<4",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "letta-client>=1.6,<2",
  "deepeval>=3.0,<4",
  "maseval>=0.1,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
