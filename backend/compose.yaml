services:
  runeterra-cognitive:
    build: .
    container_name: runeterra-cognitive
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - runeterra_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3

volumes:
  runeterra_data:
