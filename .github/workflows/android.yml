name: Android APK

on:
  push:
    branches: [ main, android-local-mode ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35'
      - name: Install NDK and CMake
        run: yes | sdkmanager --licenses && sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore cached patched llama JNI AAR
        id: llama-aar-cache
        uses: actions/cache@v4
        with:
          path: app/libs/llama-android-fixed.aar
          key: llama-aar-${{ runner.os }}-9f5469fd9fa7ea7bc7b01801923af95dc3b41d52-${{ hashFiles('scripts/patch_llama_jni_utf8.py') }}

      - name: Build patched llama JNI AAR
        if: steps.llama-aar-cache.outputs.cache-hit != 'true'
        run: |
          git clone --recurse-submodules https://github.com/ffmpegkit-maintained/llama-android.git llama-android
          cd llama-android
          git checkout 9f5469fd9fa7ea7bc7b01801923af95dc3b41d52
          git submodule update --init --recursive
          cd ..
          python3 scripts/patch_llama_jni_utf8.py
          cd llama-android
          gradle :library:assembleRelease
          cd ..
          mkdir -p app/libs
          cp llama-android/library/build/outputs/aar/library-release.aar app/libs/llama-android-fixed.aar
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: runeterra-world-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
